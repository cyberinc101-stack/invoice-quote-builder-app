plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.invoicequotegenerator.app"
    compileSdk = 36

    // FIXED DEBUG SIGNING (this pass): previously there was no explicit
    // `debug` signingConfig block, so Gradle fell back to the machine's
    // implicit default keystore at ~/.android/debug.keystore. If that file
    // was ever missing — new machine, reinstalled Android Studio/SDK, a
    // wiped user profile, even certain `flutter clean`/toolchain resets —
    // Gradle would SILENTLY generate a brand new one with a random
    // signature. That new signature no longer matches whatever's already
    // installed on the device/emulator, so Android treats the next build
    // as a different app and does a silent uninstall+reinstall, wiping
    // every saved invoice/quote/receipt in SharedPreferences at once.
    //
    // Fix: point debug signing at a FIXED keystore file that lives inside
    // this project (android/app/debug.keystore, generated once via
    // fix_debug_signing.ps1) instead of a machine-dependent default
    // location. As long as that file isn't deleted, the signature can
    // never drift — flutter clean, pub get, flutter run, a fresh machine
    // checkout, none of it can trigger a re-sign anymore.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        // DO NOT CHANGE applicationId — it's the Android-level identity
        // that ties this app to its SharedPreferences data (saved
        // invoices/quotes/receipts, alert prefs, etc). Changing it makes
        // Android treat this as a brand new app with empty storage, which
        // silently "loses" every saved document even though nothing was
        // actually deleted. versionCode/versionName bumps below are safe
        // and do NOT affect persisted data — they just install as an
        // update over the existing app, keeping its data directory intact.
        applicationId = "com.invoicequotegenerator.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 2
        versionName = "1.0.1"
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source = "../.."
}
